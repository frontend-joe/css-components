<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logins</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="card">
      <input type="checkbox" id="toggle" class="toggle" />
      <div class="card-bg"></div>

      <div class="hero register">
        <h2>Welcome back</h2>
        <p>Login to review your latest profit from investments.</p>
        <label for="toggle">LOGIN</label>
      </div>

      <div class="form register">
        <h2>Sign Up</h2>
        <form>
          <label>Name</label>
          <input type="text" placeholder="Joe Bloggs" />
          <label>Email</label>
          <input type="email" placeholder="hello@example.com" />
          <label>Password</label>
          <input type="password" placeholder="••••••••" />
          <button type="submit">SIGN UP</button>
          <span class="or"></span>
          <div class="socials">
            <button type="button" class="social-btn">
              <img src="google.svg" alt="Google" />
              <p>Google</p>
            </button>
            <button type="button" class="social-btn">
              <img src="facebook.svg" alt="Facebook" />
              <p>Facebook</p>
            </button>
          </div>
        </form>
      </div>

      <div class="hero login">
        <h2>Hello there</h2>
        <p>Begin your journey using this software, and start earning now.</p>
        <label for="toggle">SIGN UP</label>
      </div>

      <div class="form login">
        <h2>Login</h2>
        <form>
          <label>Email</label>
          <input type="email" placeholder="hello@example.com" />
          <label>Password</label>
          <input type="password" placeholder="••••••••" />
          <div class="remember-forgot">
            <div class="remember">
              <span></span>
              <a class="forgot">Remember me</a>
            </div>
            <a class="forgot">Forgot password?</a>
          </div>
          <button type="submit">LOGIN</button>
          <span class="or"></span>
          <div class="socials">
            <button type="button" class="social-btn">
              <img src="google.svg" alt="Google" />
              <p>Google</p>
            </button>
            <button type="button" class="social-btn">
              <img src="facebook.svg" alt="Facebook" />
              <p>Facebook</p>
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
