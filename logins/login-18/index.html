<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logins</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <div class="card">
      <div class="hero">
        <svg class="heart" viewBox="0 0 101.7 87.6">
          <path
            d="M51,12.8c0-0.1-0.1-0.1-0.1-0.2c0,0.1-0.1,0.1-0.1,0.2C31-10.7,0,0.2,0,28.9c0,27.6,40.7,56.9,50.9,58.8c10.1-1.8,50.9-31.1,50.9-58.8C101.7,0.2,70.7-10.7,51,12.8z"
          />
        </svg>
        <svg class="heart" viewBox="0 0 101.7 87.6">
          <path
            d="M51,12.8c0-0.1-0.1-0.1-0.1-0.2c0,0.1-0.1,0.1-0.1,0.2C31-10.7,0,0.2,0,28.9c0,27.6,40.7,56.9,50.9,58.8c10.1-1.8,50.9-31.1,50.9-58.8C101.7,0.2,70.7-10.7,51,12.8z"
          />
        </svg>
        <svg class="heart" viewBox="0 0 101.7 87.6">
          <path
            d="M51,12.8c0-0.1-0.1-0.1-0.1-0.2c0,0.1-0.1,0.1-0.1,0.2C31-10.7,0,0.2,0,28.9c0,27.6,40.7,56.9,50.9,58.8c10.1-1.8,50.9-31.1,50.9-58.8C101.7,0.2,70.7-10.7,51,12.8z"
          />
        </svg>
        <svg class="heart" viewBox="0 0 101.7 87.6">
          <path
            d="M51,12.8c0-0.1-0.1-0.1-0.1-0.2c0,0.1-0.1,0.1-0.1,0.2C31-10.7,0,0.2,0,28.9c0,27.6,40.7,56.9,50.9,58.8c10.1-1.8,50.9-31.1,50.9-58.8C101.7,0.2,70.7-10.7,51,12.8z"
          />
        </svg>
        <svg class="heart" viewBox="0 0 101.7 87.6">
          <path
            d="M51,12.8c0-0.1-0.1-0.1-0.1-0.2c0,0.1-0.1,0.1-0.1,0.2C31-10.7,0,0.2,0,28.9c0,27.6,40.7,56.9,50.9,58.8c10.1-1.8,50.9-31.1,50.9-58.8C101.7,0.2,70.7-10.7,51,12.8z"
          />
        </svg>
      </div>
      <form class="form">
        <img src="logo.svg" alt="logo" />
        <h3>Login to your account</h3>
        <div class="socials">
          <button type="button" class="social-btn">
            <img src="google.svg" alt="Google" />
            <p><span class="extra-text">Login with</span> Google</p>
          </button>
          <button type="button" class="social-btn">
            <img src="facebook.svg" alt="Facebook" />
            <p><span class="extra-text">Login with</span> Facebook</p>
          </button>
        </div>
        <span class="or"></span>
        <label class="field">
          <span class="material-symbols-outlined">mail</span>
          <input type="email" placeholder="Email" />
        </label>
        <label class="field">
          <span class="material-symbols-outlined">lock</span>
          <input type="password" placeholder="Password" />
        </label>
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
